<!DOCTYPE html>
<html>
<head>
    <title>rs2b0t — MultiBox</title>
    <meta charset="utf-8">
    <style>
        body { margin: 0; background: #000; color: #ddd; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; overflow: hidden; }

        /* Active client on the left, fixed-width thumbnail rail on the right. */
        #mbx-app { display: flex; height: 100vh; }
        #mbx-main { flex: 1 1 auto; min-width: 0; position: relative; background: #0a0a0a; }
        /* RAIL_W below must match RAIL_W in DomSlotOps.ts (focused-slot geometry depends on it) */
        #mbx-rail { flex: 0 0 264px; width: 264px; box-sizing: border-box; height: 100vh; overflow-y: auto; overflow-x: hidden; padding: 0 12px 12px; background: #111; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        #mbx-rail:focus { outline: 1px solid #04A800; outline-offset: -1px; }

        /* Why: slots use order -N..-1; the tab strip needs a lower value to stay first. */
        #mbx-tabs { order: -100000; position: sticky; top: 0; z-index: 5; flex: 0 0 auto; margin: 0 -12px; padding: 8px 12px; background: #111; border-bottom: 1px solid #222; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
        .mbx-tabchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid #2c2c2c; border-radius: 3px; background: #1a1a1a; color: #999; cursor: pointer; user-select: none; }
        .mbx-tabchip:hover { border-color: #04A800; }
        .mbx-tabchip.is-active { background: #07330a; border-color: #04A800; color: #5be05b; }
        .mbx-tabchip.is-dragging { opacity: 0.4; }
        .mbx-tabchip.mbx-tabdrop-before { box-shadow: -4px 0 0 #04A800; }
        .mbx-tabchip.mbx-tabdrop-after { box-shadow: 4px 0 0 #04A800; }
        .mbx-tabchip.mbx-tabdrop-into { border-color: #04A800; box-shadow: inset 0 0 0 1px #04A800; }
        .mbx-tabadd { color: #666; border-style: dashed; }
        .mbx-tabadd:hover { color: #04A800; }
        .mbx-tabgear { background: none; border: 0; padding: 0; color: #3f7a41; cursor: pointer; font: inherit; line-height: 1; }
        .mbx-tabgear:hover { color: #5be05b; }
        .mbx-tabinput { width: 90px; background: #000; border: 1px solid #333; color: #ddd; font: inherit; padding: 1px 4px; border-radius: 2px; }
        .mbx-tabinput.is-invalid { border-color: #e05b5b; }
        .mbx-tabmenu { position: absolute; z-index: 45; display: flex; flex-direction: column; background: #111; border: 1px solid #333; border-radius: 3px; }
        .mbx-tabmenu button { background: none; border: 0; color: #999; padding: 4px 10px; cursor: pointer; font: inherit; text-align: left; }
        .mbx-tabmenu button:hover { color: #5be05b; background: #101d11; }
        .mbx-bot-tabmenu { position: fixed; z-index: 65; min-width: 160px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow-y: auto; box-sizing: border-box; }
        .mbx-bot-tabmenu-title { padding: 6px 10px; color: #5be05b; border-bottom: 1px solid #333; }
        .mbx-bot-tabmenu button { overflow-wrap: anywhere; }
        .mbx-bot-tabmenu button:focus-visible { color: #5be05b; background: #101d11; outline: 1px solid #04A800; outline-offset: -1px; }
        .mbx-bot-tabmenu button:disabled { color: #666; cursor: default; background: none; }
        .mbx-bot-tabmenu button:disabled::after { content: ' ✓'; }
        /* Why: reparenting reloads an iframe; hide inactive slots in place. */
        .mbx-slot.mbx-tab-hidden { display: none; }

        /* a rail tile: name + status dot over a live game frame cropped to the game viewport */
        .mbx-slot { width: 236px; flex: 0 0 auto; border: 1px solid #2c2c2c; border-radius: 4px; background: #000; cursor: grab; overflow: hidden; user-select: none; }
        .mbx-slot:hover { border-color: #04A800; }
        .mbx-slot.is-focused { border-color: #04A800; }
        .mbx-slot.is-dragging { cursor: grabbing; opacity: 0.4; }
        .mbx-slot.mbx-drop-before { box-shadow: 0 -5px 0 #04A800; }
        .mbx-slot.mbx-drop-after { box-shadow: 0 5px 0 #04A800; }
        .mbx-cap { display: flex; align-items: center; gap: 6px; padding: 3px 7px; background: #1a1a1a; }
        .mbx-slot.is-focused .mbx-cap { background: #07330a; color: #5be05b; }
        .mbx-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: 0 0 auto; }
        .mbx-dot.is-running { background: #04A800; }
        .mbx-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mbx-close { margin-left: auto; flex: 0 0 auto; background: none; border: 0; color: #666; cursor: pointer; font: inherit; padding: 0 2px; }
        .mbx-close:hover { color: #e05b5b; }
        .mbx-world-controls { display: flex; align-items: center; gap: 4px; padding: 4px 7px; background: #121212; cursor: default; }
        .mbx-world-controls select, .mbx-world-controls button, .mbx-profile-row select, .mbx-chooser-form select { background: #101d11; border: 1px solid #28522a; border-radius: 3px; color: #ddd; padding: 3px 4px; font: inherit; }
        .mbx-world-controls button { cursor: pointer; }
        .mbx-world-controls button:disabled { opacity: 0.5; cursor: default; }
        .mbx-script-status { padding: 2px 7px 5px; color: #aaa; font-size: 10px; line-height: 1.4; cursor: default; }
        .mbx-profile-row { gap: 8px; }
        .mbx-profile-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        /* TILE_W/TILE_H below must match TILE_W/TILE_H in DomSlotOps.ts (crop math depends on it) */
        .mbx-body { position: relative; width: 236px; height: 155px; background: #000; }
        .mbx-clip { position: absolute; inset: 0; overflow: hidden; background: #000; }
        .mbx-scaler { width: 1100px; height: 620px; transform-origin: top left; }
        .mbx-frame { width: 1100px; height: 620px; border: 0; display: block; }
        /* shown only for the focused bot, whose own iframe is busy filling the main pane */
        .mbx-mirror { position: absolute; inset: 0; display: none; }
        /* Capture tile clicks before they reach the iframe. */
        .mbx-hit { position: absolute; inset: 0; z-index: 3; }

        /* Why: positioning the clip over the main pane avoids reloading its iframe; the rail mirrors its canvas. */
        .mbx-slot.is-focused .mbx-clip { position: fixed; top: 0; left: 0; bottom: 0; right: 264px; width: auto; height: auto; z-index: 40; }
        .mbx-slot.is-focused .mbx-mirror { display: block; }

        .mbx-addtile { display: flex; align-items: center; justify-content: center; height: 52px; flex: 0 0 auto; font-size: 14px; color: #666; border: 1px dashed #444; border-radius: 4px; cursor: pointer; }
        .mbx-addtile:hover { color: #04A800; border-color: #04A800; }
        .mbx-resources { width: 236px; box-sizing: border-box; flex: 0 0 auto; padding: 7px 8px; border: 1px solid #2c2c2c; border-radius: 4px; background: #0a0a0a; display: flex; flex-direction: column; gap: 4px; }
        .mbx-resource-bots { padding-bottom: 4px; border-bottom: 1px solid #222; color: #5be05b; }
        .mbx-bulk-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 2px 0 6px; border-bottom: 1px solid #222; }
        .mbx-bulk-controls button { min-width: 0; background: #101d11; border: 1px solid #28522a; color: #9bd49b; padding: 4px; border-radius: 3px; cursor: pointer; font: inherit; }
        .mbx-bulk-controls button:hover { border-color: #04A800; color: #5be05b; }
        .mbx-bulk-controls button:disabled { background: #0d0d0d; border-color: #222; color: #444; cursor: default; }
        .mbx-bulk-renderers { grid-column: 1 / -1; }
        .mbx-resource-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 3px 8px; }
        /* Why: display:flex overrides the browser's default [hidden] rule. */
        .mbx-resource-row[hidden] { display: none; }
        .mbx-resource-label { color: #666; }
        .mbx-resource-value { color: #bbb; text-align: right; white-space: nowrap; }
        .mbx-resource-value.mbx-resource-detail { flex: 1 0 100%; color: #d9a45b; text-align: left; white-space: normal; overflow-wrap: anywhere; line-height: 1.35; }

        #mbx-drawer { position: fixed; top: 12px; right: 264px; z-index: 50; width: 16px; height: 56px; display: flex; align-items: center; justify-content: center; background: #111; border: 1px solid #333; border-right: 0; border-radius: 4px 0 0 4px; color: #666; cursor: pointer; }
        #mbx-drawer:hover { color: #04A800; border-color: #04A800; }
        /* Why: display:none would also hide the focused iframe; collapse the rail width instead. */
        #mbx-app.mbx-rail-hidden #mbx-rail { flex: 0 0 0px; width: 0; padding: 0; border-left: 0; overflow: hidden; }
        #mbx-app.mbx-rail-hidden #mbx-drawer { right: 0; }
        #mbx-app.mbx-rail-hidden .mbx-slot.is-focused .mbx-clip { right: 0; }

        .mbx-chooser-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
        #mbx-vault { z-index: 70; }
        .mbx-chooser-overlay[hidden] { display: none; }
        .mbx-chooser { width: 300px; max-height: 70vh; overflow-y: auto; background: #111; border: 1px solid #333; border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .mbx-chooser-title { color: #5be05b; }
        .mbx-chooser-list { display: flex; flex-direction: column; gap: 4px; }
        .mbx-chooser-empty { color: #666; }
        #mbx-load-all { background: #07330a; border: 1px solid #04A800; color: #5be05b; padding: 5px 7px; border-radius: 3px; cursor: pointer; font: inherit; }
        .mbx-vault-error { color: #e05b5b; min-height: 14px; }
        .mbx-vault-reset { color: #666; cursor: pointer; text-decoration: underline; }
        .mbx-vault-reset:hover { color: #e05b5b; }
        .mbx-profile-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; border: 1px solid #2c2c2c; border-radius: 4px; cursor: pointer; }
        .mbx-profile-row:hover { border-color: #04A800; }
        .mbx-profile-del { background: none; border: 0; color: #666; cursor: pointer; font: inherit; }
        .mbx-profile-del:hover { color: #e05b5b; }
        .mbx-chooser-form { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #2c2c2c; padding-top: 8px; }
        .mbx-chooser-form input { background: #000; border: 1px solid #333; color: #ddd; padding: 5px 7px; border-radius: 3px; font: inherit; }
        .mbx-chooser-form button { background: #07330a; border: 1px solid #04A800; color: #5be05b; padding: 5px 7px; border-radius: 3px; cursor: pointer; font: inherit; }
        .rs2b0t-world-selector { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 0; font-size: 11px; color: #9bd49b; }
        .rs2b0t-world-selector select, .rs2b0t-world-selector button { background: #101d11; border: 1px solid #28522a; color: #9bd49b; font: inherit; padding: 3px; cursor: pointer; }
        .rs2b0t-world-status { flex-basis: 100%; color: #999; line-height: 1.4; }
        #mbx-manage { order: -99999; flex: 0 0 auto; padding: 8px; background: #07330a; color: #9bd49b; border: 1px solid #28522a; border-radius: 3px; font: inherit; cursor: pointer; }
        #mbx-manage:hover { border-color: #04A800; color: #5be05b; }
        .mbx-roster-overlay { position: fixed; inset: 0; z-index: 68; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .mbx-roster-overlay[hidden], .mbx-roster-dialog [hidden] { display: none; }
        .mbx-roster-dialog { width: 1040px; max-width: 100%; max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: #111; border: 1px solid #444; border-radius: 4px; box-shadow: 0 20px 80px #000; overflow: hidden; font-size: 11px; }
        .mbx-roster-dialog header, .mbx-roster-dialog footer { display: flex; align-items: center; gap: 20px; padding: 14px 16px; background: #141414; flex-shrink: 0; }
        .mbx-roster-dialog header { border-bottom: 1px solid #333; }
        .mbx-roster-dialog header strong { color: #5be05b; font-size: 12px; }
        .mbx-roster-dialog button, .mbx-roster-dialog input, .mbx-roster-dialog select { font: inherit; }
        .mbx-roster-dialog button { padding: 6px 8px; color: #a6d9a6; border: 1px solid #28522a; background: #101d11; border-radius: 2px; cursor: pointer; }
        .mbx-roster-dialog button:hover, .mbx-roster-dialog button[aria-pressed="true"] { color: #5be05b; border-color: #04A800; background: #07330a; }
        .mbx-roster-dialog button:disabled, .mbx-roster-dialog input:disabled, .mbx-roster-dialog select:disabled { opacity: .45; cursor: default; }
        .mbx-roster-dialog :focus-visible { outline: 1px solid #5be05b; outline-offset: 2px; }
        #mbx-roster-close { margin-left: auto; padding: 0 3px; border: 0; background: transparent; color: #888; font-size: 18px; line-height: 1; }
        .mbx-roster-filters { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 16px 16px 12px; flex-shrink: 0; }
        .mbx-roster-tabs { display: flex; flex-wrap: wrap; gap: 5px; }
        #mbx-roster-search { width: 150px; background: #000; border: 1px solid #333; color: #ddd; border-radius: 3px; padding: 7px 8px; }
        .mbx-roster-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 16px; padding: 10px 12px; border: 1px solid #333; background: #141414; flex-shrink: 0; }
        #mbx-roster-count { color: #5be05b; margin-right: 6px; }
        .mbx-roster-content { display: grid; grid-template-columns: minmax(0, 1fr) 258px; min-height: 260px; overflow-y: auto; margin: 0 16px; border: 1px solid #333; border-top: 0; }
        .mbx-roster-list { min-width: 0; overflow-x: auto; }
        .mbx-roster-scope { display: flex; align-items: center; gap: 5px; padding: 8px 12px; border-bottom: 1px solid #333; color: #999; font-size: 10px; }
        .mbx-roster-scope span { margin-right: auto; }
        .mbx-roster-scope button { padding: 2px 4px; border: 0; background: transparent; color: #999; }
        #mbx-roster-table { width: 100%; min-width: 650px; border-collapse: collapse; table-layout: fixed; text-align: left; }
        #mbx-roster-table th { color: #999; font-weight: normal; font-size: 10px; padding: 9px 4px; }
        #mbx-roster-table th:first-child { width: 25px; }
        #mbx-roster-table th:nth-child(2) { width: 42%; }
        #mbx-roster-table th:nth-child(3) { width: 16%; }
        #mbx-roster-table th:nth-child(4) { width: 9%; }
        #mbx-roster-table th:last-child { width: 45px; }
        #mbx-roster-table td { padding: 10px 4px; border-top: 1px solid #292929; overflow-wrap: anywhere; vertical-align: middle; }
        #mbx-roster-table td:first-child, #mbx-roster-table th:first-child { padding-left: 12px; }
        #mbx-roster-table small { display: block; margin-top: 5px; font-size: 10px; line-height: 1.4; }
        #mbx-roster-table input { accent-color: #7ed387; margin: 0; }
        #mbx-roster-table tr.is-selected { background: #0b1c0d; }
        #mbx-roster-table [data-edit] { border: 0; background: transparent; color: #999; padding: 3px 0; font-size: 10px; }
        .mbx-roster-muted { color: #999; }
        .mbx-roster-pane { padding: 14px; border-left: 1px solid #333; background: #141414; min-width: 0; }
        .mbx-roster-pane h3 { color: #5be05b; font-size: 12px; font-weight: normal; margin: 0 0 10px; }
        .mbx-roster-pane p { line-height: 1.5; color: #aaa; }
        .mbx-roster-field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; color: #999; }
        .mbx-roster-field select { width: 100%; box-sizing: border-box; min-width: 0; background: #000; color: #ddd; border: 1px solid #333; border-radius: 2px; padding: 6px; }
        .mbx-roster-preview { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; margin: 12px 0; padding: 10px; border: 1px solid #333; border-radius: 2px; background: #0c0c0c; overflow-wrap: anywhere; font-size: 10px; }
        .mbx-roster-preview dt:first-child { grid-column: 1 / -1; font-size: 9px; margin-bottom: 4px; }
        .mbx-roster-preview dd { margin: 0; text-align: right; }
        .mbx-roster-note { border-left: 2px solid #28522a; padding-left: 8px; }
        #mbx-roster-apply { width: 100%; border-color: #04A800; color: #5be05b; background: #07330a; padding: 9px; }
        .mbx-roster-status { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; font-size: 10px; color: #999; flex-shrink: 0; }
        #mbx-roster-message { text-align: right; }
        .mbx-roster-dialog footer { justify-content: space-between; border-top: 1px solid #333; }
        #mbx-roster-done { padding: 7px 20px; }
        .mbx-roster-dialog .is-running, .mbx-roster-dialog .is-done { color: #5be05b; }
        .mbx-roster-dialog .is-failed { color: #e05b5b; }
        .mbx-roster-dialog .is-skipped { color: #d9a45b; }
        @media (max-width: 1000px) { .mbx-roster-overlay { padding: 8px; } .mbx-roster-dialog { max-height: calc(100vh - 16px); } .mbx-roster-content { grid-template-columns: 1fr; } .mbx-roster-pane { border-left: 0; border-top: 1px solid #333; } .mbx-roster-filters { align-items: stretch; flex-direction: column; } #mbx-roster-search { width: auto; } }
    </style>
</head>
<body>
    <div id="mbx-app">
        <div id="mbx-main"></div>
        <div id="mbx-rail" tabindex="0" aria-label="running bots">
            <div id="mbx-tabs" aria-label="bot tabs"></div>
            <button id="mbx-manage" type="button">manage bots</button>
            <div id="mbx-add" class="mbx-addtile">+ add bot</div>
            <div id="mbx-resources" class="mbx-resources">
                <div id="mbx-resource-bots" class="mbx-resource-bots">0 bots (0 running)</div>
                <div class="mbx-bulk-controls" aria-label="all bot controls">
                    <button id="mbx-start-all" type="button">start all</button>
                    <button id="mbx-stop-all" type="button">stop all</button>
                    <button id="mbx-renderers-off" class="mbx-bulk-renderers" type="button">turn all renderers off</button>
                    <button id="mbx-renderers-on" class="mbx-bulk-renderers" type="button">turn all renderers on</button>
                    <button id="mbx-settings" class="mbx-bulk-renderers" type="button">settings</button>
                </div>
                <div id="mbx-resource-cpu-row" class="mbx-resource-row" title="CPU used by every process/thread in the dedicated bot browser"><span class="mbx-resource-label">CPU</span><span id="mbx-resource-cpu" class="mbx-resource-value">measuring…</span></div>
                <div id="mbx-resource-memory-row" class="mbx-resource-row" title="Current memory charged to the dedicated bot browser"><span class="mbx-resource-label">RAM</span><span id="mbx-resource-memory" class="mbx-resource-value">measuring…</span></div>
                <div class="mbx-resource-row" title="Bot game and cache WebSocket payload measured inside each client"><span class="mbx-resource-label">Traffic</span><span id="mbx-resource-traffic" class="mbx-resource-value">measuring…</span></div>
                <div class="mbx-resource-row" title="Git commit baked into this wall build (also /rs2b0t/version.json)"><span class="mbx-resource-label">Build</span><span id="mbx-build" class="mbx-resource-value">…</span></div>
            </div>
        </div>
        <div id="mbx-drawer" title="show/hide bots">▶</div>
    </div>
    <script type="module" src="./bot/multibox.js"></script>
</body>
</html>
