name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Why: @vvago/vale downloads the Vale binary from GitHub releases, where transient
      # failures should retry dependency installation rather than rerunning the tests.
      - name: install dependencies
        run: |
          for attempt in 1 2 3 4; do
            bun install --frozen-lockfile && exit 0
            if [ "$attempt" -lt 4 ]; then
              echo "bun install failed (attempt $attempt); retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - run: bun test

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: prose
        run: bun run lint:prose

      - name: prose extras
        run: bun run lint:prose:extras
