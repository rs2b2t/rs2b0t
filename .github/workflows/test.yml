name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun test

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: prose
        run: bun run lint:prose

      - name: prose extras
        run: bun run lint:prose:extras
