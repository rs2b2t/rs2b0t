name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Why: @vvago/vale downloads the Vale binary from GitHub releases, where transient
      # failures should retry dependency installation rather than rerunning the tests.
      - name: install dependencies
        run: |
          for attempt in 1 2 3 4; do
            bun install --frozen-lockfile && exit 0
            if [ "$attempt" -lt 4 ]; then
              echo "bun install failed (attempt $attempt); retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - run: bun test

      - name: Build and check client bundles
        run: |
          bun run build
          bun tools/check-bundle-defines.ts out/client.js out/mapview.js out/ondemandworker.js

      - name: Build and check bot bundles
        env:
          B0T_OUT_DIR: out/bot
        run: |
          bun run build:bot
          bun tools/check-bundle-defines.ts out/bot/botclient.js out/bot/multibox.js out/bot/ondemandworker.js out/bot/navworker.js

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: prose
        run: bun run lint:prose

      - name: prose extras
        run: bun run lint:prose:extras
